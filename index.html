<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shara Light — Accedi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card" aria-labelledby="title">
        <div class="card-header">
            <div class="logo">💡</div>
            <h1 id="title">Shara Light</h1>
            <p class="subtitle">Accedi al tuo account</p>
        </div>

        <div id="alert" class="alert alert-error hidden" role="alert"></div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="mario.rossi@example.com"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary">Accedi</button>
        </form>

        <p class="form-footer">
            Non hai un account?
            <a href="register.html">Registrati</a>
        </p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
