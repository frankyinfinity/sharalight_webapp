<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shara Light — Pagamento Annullato</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="app-shell" aria-labelledby="page-title">
        <header class="app-header">
            <a href="orders.html" class="btn btn-ghost btn-icon" aria-label="Torna agli ordini">‹</a>
            <div class="app-brand">
                <span class="logo">✕</span>
                <span id="page-title">Pagamento Annullato</span>
            </div>
            <span class="header-spacer"></span>
        </header>

        <section class="app-content">
            <div class="panel panel-center">
                <div class="cancel-icon">✕</div>
                <h2 class="panel-title">Pagamento annullato</h2>
                <p class="panel-sub">Hai annullato il pagamento PayPal. L'ordine è stato creato ma non è stato pagato.</p>
                <p class="panel-hint">Puoi riprovare il pagamento dalla pagina dei tuoi ordini.</p>
            </div>
        </section>

        <footer class="bottom-bar">
            <a href="orders.html" class="btn btn-primary btn-lg">Vai ai tuoi ordini</a>
        </footer>
    </main>

    <script src="js/api.js"></script>
</body>
</html>
