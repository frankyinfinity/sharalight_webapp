<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shara Light — Registrati</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card" aria-labelledby="title">
        <div class="card-header">
            <div class="logo">💡</div>
            <h1 id="title">Shara Light</h1>
            <p class="subtitle">Crea un nuovo account</p>
        </div>

        <div id="alert" class="alert alert-error hidden" role="alert"></div>

        <form id="register-form" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">Nome</label>
                    <input type="text" id="first_name" name="first_name" placeholder="Mario"
                           autocomplete="given-name" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Cognome</label>
                    <input type="text" id="last_name" name="last_name" placeholder="Rossi"
                           autocomplete="family-name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="mario.rossi@example.com"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Almeno 8 caratteri"
                       autocomplete="new-password" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="password_confirmation">Conferma password</label>
                <input type="password" id="password_confirmation" name="password_confirmation"
                       placeholder="Ripeti la password" autocomplete="new-password" minlength="8" required>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary">Registrati</button>
        </form>

        <p class="form-footer">
            Hai già un account?
            <a href="index.html">Accedi</a>
        </p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
